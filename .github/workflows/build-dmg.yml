name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zostaviť aplikáciu a DMG
        run: |
          chmod +x build.sh make_dmg.sh
          ./make_dmg.sh
          mv build/*.dmg build/VimeoViewer.dmg

      - name: Nahrať DMG ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Vimeo-Viewer-dmg
          path: build/VimeoViewer.dmg

      - name: Náhľad ikony do logu
        run: |
          sips -z 200 200 build/icon_1024.png --out /tmp/icon_small.png >/dev/null
          echo "ICONB64-START"; base64 -i /tmp/icon_small.png; echo "ICONB64-END"

      - name: Zverejniť DMG v Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/VimeoViewer.dmg --clobber
            for old in VimeoViewer-AppleSilicon.dmg VimeoViewer-Intel.dmg; do
              gh release delete-asset "$TAG" "$old" -y 2>/dev/null || true
            done
          else
            gh release create "$TAG" build/VimeoViewer.dmg --target "$GITHUB_SHA" \
              --title "Vimeo Viewer $TAG" --notes "Stiahnite VimeoViewer.dmg, otvorte ho a pretiahnite aplikáciu do priečinka Aplikácie."
          fi
